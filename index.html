<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>やらせ動画作成魔死ーん</title>
<style>
:root {
  --bg: #0B0C0E;
  --surface: #16181C;
  --surface-hover: #1D2025;
  --border: #33373E;
  --border-strong: #52565F;
  --text-primary: #EDEDEF;
  --text-secondary: #9AA0AC;
  --text-tertiary: #6B7280;
  --accent: #F2F2F0;
  --accent-text: #0B0C0E;
  --danger: #E5484D;
  --danger-text: #FDECEC;
  --success: #4E9B72;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
body{
  background:var(--bg); color:var(--text-primary);
  font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  font-size:14px; line-height:1.5;
  padding:var(--space-8) var(--space-4) var(--space-12);
}
.wrap{max-width:720px;margin:0 auto;}
.header{border-bottom:1px solid var(--border);padding-bottom:var(--space-4);margin-bottom:var(--space-6);}
h1{font-size:20px;font-weight:600;letter-spacing:-0.01em;margin:0 0 var(--space-2) 0;}
p{color:var(--text-secondary);font-size:13px;margin:0;}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-6);margin-bottom:var(--space-4);}
.section-label{font-size:11px;color:var(--text-tertiary);margin-bottom:var(--space-3);}
.drop{display:block;border:1.5px dashed var(--border);border-radius:var(--radius-md);
  padding:var(--space-8) var(--space-4);text-align:center;cursor:pointer;transition:.12s;}
.drop:hover,.drop.drag{border-color:var(--border-strong);background:var(--surface-hover);}
.drop input{display:none;}
.drop .hint{color:var(--text-tertiary);font-size:12px;margin-top:var(--space-2);}
.btn{font-family:inherit;font-size:13px;border-radius:var(--radius-sm);
  padding:var(--space-2) var(--space-4);border:1px solid var(--border);
  background:transparent;color:var(--text-primary);cursor:pointer;}
.btn:hover{background:var(--surface-hover);border-color:var(--border-strong);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:500;}
.btn-primary:hover{background:#DCDCDA;}
.btn-danger{color:var(--danger);border-color:var(--border);}
.btn-danger:hover{background:rgba(229,72,77,.1);border-color:var(--danger);}
.controls{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;margin-top:var(--space-4);}
.progress{flex:1;min-width:140px;height:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);overflow:hidden;}
.progress-bar{height:100%;width:0%;background:var(--accent);border-radius:inherit;transition:width .2s ease;}
.time{font-size:12px;color:var(--text-tertiary);min-width:84px;text-align:right;}
.table{width:100%;border-collapse:collapse;font-size:13px;margin-top:var(--space-2);}
.table th{text-align:left;color:var(--text-tertiary);font-weight:500;font-size:11px;
  padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border);}
.table td{padding:var(--space-3);border-bottom:1px solid var(--border);color:var(--text-primary);}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--border-strong);color:var(--text-secondary);}
.color-swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--border-strong);}
.mc-select{font-family:inherit;font-size:12px;background:var(--bg);color:var(--text-primary);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px 6px;}
.status{font-size:12px;color:var(--text-tertiary);min-height:1.2em;margin-top:var(--space-2);}
::-webkit-scrollbar{height:6px;}
.padgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:var(--space-2);}
.pad{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:var(--space-2) var(--space-1);text-align:center;font-size:11px;color:var(--text-tertiary);
  transition:background .12s,color .12s,border-color .12s;user-select:none;}
.pad.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);
  animation:padFlash .35s ease-out;}
@keyframes padFlash{0%{box-shadow:0 0 0 0 rgba(242,242,240,.35);}100%{box-shadow:0 0 0 8px rgba(242,242,240,0);}}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  align-items:center;justify-content:center;z-index:1000;padding:var(--space-4);}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-6);width:100%;max-width:360px;}
.progress-bar.indeterminate{width:35%;animation:indet 1.1s ease-in-out infinite;}
@keyframes indet{0%{margin-left:0%;}50%{margin-left:65%;}100%{margin-left:0%;}}
.pianoroll-wrap{position:relative;width:100%;height:180px;border-radius:var(--radius-sm);overflow:hidden;}
.pianoroll-wrap canvas{display:block;width:100%;height:180px;background:var(--bg);}
#rollFg{position:absolute;top:0;left:0;pointer-events:none;background:transparent;}
</style>

    case 'banjo': { env(P*v,0.003,0.5); stopAll([osc('triangle',freq),osc('triangle',freq*2.01,4)],0.5); break; }
    case 'pling': { env(P*v,0.003,0.6); stopAll([osc('sine',freq*2)],0.6); break; }
    case 'snare': { const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=900;
      s.connect(f); f.connect(g); env(P*v,0.001,0.18); s.start(t); s.stop(t+0.2); break; }
    case 'hat': { const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=5000;
      s.connect(f); f.connect(g); env(P*0.8*v,0.001,0.08); s.start(t); s.stop(t+0.1); break; }
    case 'basedrum': { env(P*v,0.001,0.25); stopAll([osc('sine',60)],0.25); break; }
    default: { env(P*v,0.005,0.8); stopAll([osc('triangle',freq)],0.8); }
  }
}

// ---------- App wiring ----------
const els={
  drop:document.getElementById('drop'), file:document.getElementById('file'),
  playBtn:document.getElementById('playBtn'), pauseBtn:document.getElementById('pauseBtn'),
  stopBtn:document.getElementById('stopBtn'), mp3Btn:document.getElementById('mp3Btn'), bar:document.getElementById('bar'),
  time:document.getElementById('time'), status:document.getElementById('status'),
  mapPanel:document.getElementById('mapPanel'), mapTable:document.querySelector('#mapTable tbody')
};
let songNotes=null, songDuration=0, audioCtx=null, noiseBuf=null, masterBus=null, playStartCtxTime=0, rafId=null, isPlaying=false, hasScheduled=false, fireIndex=0, lastStatus='', playNotes=null;

// ---------- Now-playing pad grid ----------
const PAD_NAMES=['harp','bass','basedrum','snare','hat','bell','flute','chime',
  'guitar','xylophone','iron_xylophone','cow_bell','didgeridoo','bit','banjo','pling'];
const padEls={};
(function buildPadGrid(){
  const grid=document.getElementById('padGrid');
  for(const name of PAD_NAMES){
    const div=document.createElement('div'); div.className='pad';
    div.textContent=name;
    grid.appendChild(div); padEls[name]=div;
  }
})();
function flashPad(mc){
  const pad=padEls[mc]; if(!pad) return;
  // avoid a synchronous forced reflow (was: remove class, read offsetWidth, add class) —
  // that's cheap for one note but a dense chord can call this dozens of times in a single
  // animation frame, and the forced layout reads were enough to jank the main thread and
  // make everything (audio scheduling included) feel like it's stuttering/slowing down.
  pad.classList.remove('active');
  requestAnimationFrame(()=>pad.classList.add('active'));
}

// ---------- Piano roll (static overview + moving playhead) ----------
// color by MIDI channel rather than the Minecraft-instrument category — several different
// MIDI instruments often collapse into the same note-block instrument (e.g. all "Synth
// Lead" programs become 'bit'), which would give them identical colors; channel maps far
// more closely to "which instrument" in how MIDI files are actually authored.
function rollColorForChannel(ch){ return `hsl(${(ch*22.5)%360},70%,62%)`; }
const rollBg=document.getElementById('rollBg'), rollFg=document.getElementById('rollFg');
const rollBgCtx=rollBg.getContext('2d'), rollFgCtx=rollFg.getContext('2d');
// scrolling window centered near the playhead (fixed on screen at ROLL_PLAYHEAD_FRAC from the
// left) instead of squeezing the whole song into one static view — a dense/long song made
// individual notes unreadably small when compressed to 800px, this way each note gets much
// more horizontal room regardless of song length.
const ROLL_WINDOW_SEC=6, ROLL_PLAYHEAD_FRAC=0.18;
let rollPitchMin=40, rollPitchMax=80;
function rollComputePitchRange(notes){
  if(!notes.length){ rollPitchMin=40; rollPitchMax=80; return; }
  let minP=127, maxP=0;
  for(const n of notes){ if(n.note<minP) minP=n.note; if(n.note>maxP) maxP=n.note; }
  rollPitchMin=minP-2; rollPitchMax=maxP+2;
}
function drawRollStatic(){
  const W=rollBg.width, H=rollBg.height;
  rollBgCtx.clearRect(0,0,W,H);
  rollBgCtx.fillStyle='#0B0C0E'; rollBgCtx.fillRect(0,0,W,H);
  rollBgCtx.strokeStyle='rgba(255,255,255,.06)'; rollBgCtx.lineWidth=1;
  for(let i=0;i<=ROLL_WINDOW_SEC;i++){ const gx=(i/ROLL_WINDOW_SEC)*W; rollBgCtx.beginPath(); rollBgCtx.moveTo(gx,0); rollBgCtx.lineTo(gx,H); rollBgCtx.stroke(); }
  const px=ROLL_PLAYHEAD_FRAC*W;
  rollBgCtx.strokeStyle='rgba(242,242,240,.55)'; rollBgCtx.lineWidth=1.5;
  rollBgCtx.beginPath(); rollBgCtx.moveTo(px,0); rollBgCtx.lineTo(px,H); rollBgCtx.stroke();
}
function drawRollNotes(elapsed){
  const W=rollFg.width, H=rollFg.height;
  rollFgCtx.clearRect(0,0,W,H);
  if(!songNotes || !songNotes.length) return;
  const winStart=elapsed - ROLL_WINDOW_SEC*ROLL_PLAYHEAD_FRAC;
  const winEnd=winStart + ROLL_WINDOW_SEC;
  const span=Math.max(1, rollPitchMax-rollPitchMin);
  rollFgCtx.globalAlpha=0.95;
  for(const n of songNotes){
    if(n.sec<winStart) continue;
    if(n.sec>winEnd) break; // songNotes is sorted by time, safe to stop scanning here
    const x=((n.sec-winStart)/ROLL_WINDOW_SEC)*W;
    const y=H - ((n.note-rollPitchMin)/span)*H;
    rollFgCtx.fillStyle=rollColorForChannel(n.ch);
    rollFgCtx.fillRect(x-2, y-3, 5, 6);
  }
  rollFgCtx.globalAlpha=1;
}
drawRollStatic(); // grid + fixed playhead marker are visible even before a file loads

// ---------- Real sample support (bundled) ----------
const samples={}, sampleGain={};
// manual per-instrument multiplier on top of auto-normalization, for ones that still sound off by ear
const MANUAL_BOOST={ xylophone:2.4, iron_xylophone:2.8, bell:2.2 };
async function decodeToBuffer(file){ const ctx=ensureCtx(); const ab=await file.arrayBuffer(); return await ctx.decodeAudioData(ab); }
function measureRMS(buffer){
  let sumSq=0, n=0;
  for(let c=0;c<buffer.numberOfChannels;c++){
    const d=buffer.getChannelData(c);
    for(let i=0;i<d.length;i++){ sumSq+=d[i]*d[i]; }
    n+=d.length;
  }
  return Math.sqrt(sumSq/Math.max(1,n)) || 0.001;
}

// preload embedded samples (bundled at build time), normalizing perceived loudness across instruments
async function loadEmbedded(){
  if(typeof EMBEDDED_SAMPLES==='undefined') return;
  const ctx=ensureCtx();
  for(const [name,b64] of Object.entries(EMBEDDED_SAMPLES)){
    try{
      const bin=atob(b64); const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const buf=await ctx.decodeAudioData(bytes.buffer);
      samples[name]=buf;
      const rms=measureRMS(buf);
      // RMS (not peak) better reflects perceived loudness for short/transient hits like
      // xylophone, which have a high peak but decay fast — a peak-only normalization
      // under-boosts them relative to sustained sounds like bell/chime.
      // Target kept modest (0.10) so the resulting gain rarely hits playSampleVoice's
      // safety ceiling — a target that's too high made every instrument clip to the
      // same ceiling, erasing the normalization instead of applying it.
      sampleGain[name]=Math.max(0.4, Math.min(3.5, 0.10/rms)) * (MANUAL_BOOST[name]||1);
    }catch(e){ /* skip failed decode */ }
  }
}
loadEmbedded();

function fmtTime(s){ s=Math.max(0,s|0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function handleFile(f){
  stop(); // clear any previous song's scheduled notes/context before loading a new one
  els.status.textContent='読み込み中…';
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=parseMidi(reader.result);
      const {notes,chInstrumentUse,duration}=buildNoteEvents(parsed);
      songNotes=notes; songDuration=duration;
      lastStatus=`解析完了: ${notes.length}音 / 長さ ${fmtTime(duration)} / トラック${parsed.tracks.length}`;
      els.status.textContent=lastStatus;
      els.playBtn.disabled=false;
      els.mp3Btn.disabled=false;
      renderMapTable(chInstrumentUse);
      rollComputePitchRange(notes);
      drawRollNotes(0);
      els.time.textContent=`0:00 / ${fmtTime(duration)}`;
      els.bar.style.width='0%';
    }catch(err){
      els.status.textContent='読み込みエラー: '+err.message;
      els.playBtn.disabled=true;
      els.mp3Btn.disabled=true;
    }
  };
  reader.readAsArrayBuffer(f);
}
function renderMapTable(map){
  els.mapTable.innerHTML='';
  const rows=Object.entries(map).sort((a,b)=>a[0]-b[0]);
  for(const [ch,info] of rows){
    const tr=document.createElement('tr');
    const label = info.isDrum ? 'Percussion (Ch10)' : GM_NAMES[info.prog];
    const swatch=`<span class="color-swatch" style="background:${rollColorForChannel(+ch)}"></span>`;
    const options=PAD_NAMES.map(name=>`<option value="${name}"${name===info.mc?' selected':''}>${name}</option>`).join('');
    tr.innerHTML=`<td>${swatch}</td><td>${+ch+1}</td><td>${label}</td>
      <td><select class="mc-select" data-ch="${ch}">${options}</select></td><td>${info.count}</td>`;
    els.mapTable.appendChild(tr);
  }
  els.mapPanel.style.display = rows.length? 'block':'none';
  els.mapTable.querySelectorAll('.mc-select').forEach(sel=>{
    sel.addEventListener('change', e=>{
      const ch=+e.target.dataset.ch, newMc=e.target.value;
      for(const n of songNotes){ if(n.ch===ch) n.mc=newMc; }
      if(map[ch]) map[ch].mc=newMc;
    });
  });
}

function makeMasterBus(ctx){
  // soft limiter so many simultaneously-stacked notes don't just add up and clip
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-8; comp.knee.value=12; comp.ratio.value=14;
  comp.attack.value=0.002; comp.release.value=0.12;
  comp.connect(ctx.destination);
  return comp;
}
function ensureCtx(){ if(!audioCtx || audioCtx.state==='closed'){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); noiseBuf=makeNoiseBuffer(audioCtx); masterBus=makeMasterBus(audioCtx); } return audioCtx; }

// Rolling lookahead scheduler (the standard Web Audio pattern) instead of scheduling the
// whole song upfront: a lightweight timer periodically schedules only the notes due in the
// next SCHEDULE_AHEAD seconds. Each tick's work is tiny and bounded regardless of how dense
// or long the song is, which sidesteps both earlier failure modes at the root — there's no
// big synchronous burst of node creation to freeze the tab, and no note is ever scheduled
// far enough into the future for the context's clock to race ahead of it and land in the past.
const SCHEDULE_AHEAD=0.15, SCHEDULE_INTERVAL=30;
let schedulerTimer=null, schedIndex=0;
function schedulerTick(){
  if(!audioCtx || audioCtx.state!=='running') return;
  const horizon=audioCtx.currentTime + SCHEDULE_AHEAD;
  while(schedIndex<playNotes.length && playStartCtxTime+playNotes[schedIndex].sec<=horizon){
    const n=playNotes[schedIndex];
    playVoice(audioCtx,noiseBuf,masterBus,n.mc,n.note,n.vel,playStartCtxTime+n.sec,samples,sampleGain);
    schedIndex++;
  }
  if(schedIndex>=playNotes.length) stopScheduler();
}
function startScheduler(){ if(schedulerTimer) return; schedulerTick(); schedulerTimer=setInterval(schedulerTick,SCHEDULE_INTERVAL); }
function stopScheduler(){ if(schedulerTimer){ clearInterval(schedulerTimer); schedulerTimer=null; } }

function play(){
  if(!songNotes || !songNotes.length) return;
  const ctx=ensureCtx();
  if(ctx.state==='suspended'){ ctx.resume(); }
  if(!hasScheduled){
    playNotes=limitPolyphony(songNotes);
    schedIndex=0;
    playStartCtxTime=ctx.currentTime+0.05;
    hasScheduled=true;
  }
  isPlaying=true;
  els.playBtn.disabled=true; els.pauseBtn.disabled=false; els.stopBtn.disabled=false;
  startScheduler();
  tick();
}
function pause(){ if(audioCtx && audioCtx.state==='running'){ audioCtx.suspend(); } isPlaying=false;
  stopScheduler(); els.playBtn.disabled=false; els.pauseBtn.disabled=true; cancelAnimationFrame(rafId); }
function stop(){ stopScheduler(); if(audioCtx){ audioCtx.close(); audioCtx=null; } isPlaying=false; hasScheduled=false; fireIndex=0; schedIndex=0;
  els.playBtn.disabled=false; els.pauseBtn.disabled=true; els.stopBtn.disabled=true;
  els.bar.style.width='0%'; els.time.textContent=`0:00 / ${fmtTime(songDuration)}`; cancelAnimationFrame(rafId); drawRollNotes(0); }
function tick(){
  if(!audioCtx || !isPlaying) return;
  const elapsed = audioCtx.currentTime - playStartCtxTime;
  const frac = Math.min(1, Math.max(0, elapsed/Math.max(songDuration,0.001)));
  els.bar.style.width=(frac*100)+'%';
  els.time.textContent=`${fmtTime(elapsed)} / ${fmtTime(songDuration)}`;
  drawRollNotes(elapsed);
  while(fireIndex<playNotes.length && playNotes[fireIndex].sec<=elapsed){ flashPad(playNotes[fireIndex].mc); fireIndex++; }
  if(elapsed>=songDuration+0.5){ stop(); return; }
  rafId=requestAnimationFrame(tick);
}

els.drop.addEventListener('click',()=>els.file.click());
els.file.addEventListener('change',e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
['dragover','dragenter'].forEach(ev=>els.drop.addEventListener(ev,e=>{e.preventDefault();els.drop.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>els.drop.addEventListener(ev,e=>{e.preventDefault();els.drop.classList.remove('drag');}));
els.drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) handleFile(f); });
els.playBtn.addEventListener('click',play);
els.pauseBtn.addEventListener('click',pause);
els.stopBtn.addEventListener('click',stop);
els.mp3Btn.addEventListener('click',exportMp3);

const exportModal=document.getElementById('exportModal'), exportPhase=document.getElementById('exportPhase'),
  exportBar=document.getElementById('exportBar'), exportPct=document.getElementById('exportPct');
function showExportModal(){ exportModal.classList.add('show'); }
function hideExportModal(){ exportModal.classList.remove('show'); }
function setExportProgress(phase, pct, etaSec){
  exportPhase.textContent=phase;
  if(pct==null){ exportBar.classList.add('indeterminate'); exportBar.style.width=''; exportPct.textContent='処理中…（曲によってはとても時間がかかる場合があります）'; }
  else {
    exportBar.classList.remove('indeterminate'); exportBar.style.width=pct+'%';
    let txt=Math.round(pct)+'%';
    if(etaSec!=null && isFinite(etaSec)) txt += `（残り約${Math.max(0,Math.round(etaSec))}秒）`;
    exportPct.textContent=txt;
  }
}

async function exportMp3(){
  if(!songNotes || !songNotes.length) return;
  els.mp3Btn.disabled=true; els.playBtn.disabled=true;
  showExportModal();
  setExportProgress('音声をレンダリング中…', null);
  try{
    const sr=44100;
    const offline=new OfflineAudioContext(2, Math.ceil(sr*(songDuration+2)), sr);
    const offNoise=makeNoiseBuffer(offline);
    const offBus=makeMasterBus(offline);
    for(const n of limitPolyphony(songNotes)){ playVoice(offline,offNoise,offBus,n.mc,n.note,n.vel,n.sec,samples,sampleGain); }
    const rendered=await offline.startRendering();
    const ch0=rendered.getChannelData(0), ch1=rendered.numberOfChannels>1?rendered.getChannelData(1):ch0;
    const len=ch0.length;
    const toInt16=f=>{ const s=Math.max(-1,Math.min(1,f)); return s<0?s*0x8000:s*0x7FFF; };
    const left=new Int16Array(len), right=new Int16Array(len);
    for(let i=0;i<len;i++){ left[i]=toInt16(ch0[i]); right[i]=toInt16(ch1[i]); }
    const encoder=new lamejs.Mp3Encoder(2,sr,160);
    const block=1152; const chunks=[];
    const totalBlocks=Math.max(1,Math.ceil(len/block));
    let doneBlocks=0;
    const encodeStart=performance.now();
    setExportProgress('MP3にエンコード中…', 0);
    for(let i=0;i<len;i+=block){
      const buf=encoder.encodeBuffer(left.subarray(i,i+block), right.subarray(i,i+block));
      if(buf.length>0) chunks.push(buf);
      doneBlocks++;
      if(doneBlocks%40===0){
        const frac=doneBlocks/totalBlocks;
        const elapsedSec=(performance.now()-encodeStart)/1000;
        const etaSec = frac>0 ? elapsedSec*(1-frac)/frac : null;
        setExportProgress('MP3にエンコード中…', frac*100, etaSec);
        await new Promise(r=>setTimeout(r,0));
      }
    }
    const tail=encoder.flush(); if(tail.length>0) chunks.push(tail);
    setExportProgress('MP3にエンコード中…', 100, 0);
    const blob=new Blob(chunks,{type:'audio/mp3'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='noteblock-cover.mp3';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    els.status.textContent=lastStatus+'（MP3を保存しました）';
  }catch(err){
    els.status.textContent='MP3書き出しエラー: '+err.message;
  }finally{
    hideExportModal();
    els.mp3Btn.disabled=false; els.playBtn.disabled=false;
  }
}

</script>
</body>
